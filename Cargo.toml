[package]
name = "crossbook"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn" }

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2"] }
# The WebSocket TLS needs a rustls crypto provider; tokio-tungstenite enables none itself, and
# the socket must not depend on reqwest's features for it.
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
